<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>freee クイック検索</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; font-family: "Hiragino Sans", "Meiryo", sans-serif; font-size: 13px; background: #f5f7fa; color: #2c3e50; }
    .header { background: linear-gradient(135deg, #3ea8ff 0%, #1e74d0 100%); color: white; padding: 14px 16px 12px; display: flex; align-items: center; justify-content: space-between; }
    .header-title { font-size: 15px; font-weight: 700; }
    .header-sub { font-size: 11px; opacity: 0.85; margin-top: 2px; }
    .header-icon { font-size: 26px; }
    .search-bar { padding: 10px 14px; background: white; border-bottom: 1px solid #eef1f4; }
    .search-input { width: 100%; padding: 7px 12px; border: 1px solid #d5dce4; border-radius: 8px; font-size: 13px; outline: none; font-family: inherit; }
    .search-input:focus { border-color: #3ea8ff; }
    .list { max-height: 380px; overflow-y: auto; }
    .list-empty { padding: 32px 16px; text-align: center; color: #95a5a6; line-height: 1.7; }
    .list-empty .icon { font-size: 30px; margin-bottom: 8px; }
    .item { display: flex; align-items: flex-start; padding: 10px 14px; border-bottom: 1px solid #eef1f4; background: white; cursor: pointer; gap: 10px; transition: background 0.1s; }
    .item:hover { background: #f0f6ff; }
    .item-icon { font-size: 15px; margin-top: 2px; flex-shrink: 0; }
    .item-body { flex: 1; min-width: 0; }
    .item-label { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 11px; color: #95a5a6; margin-top: 2px; display: flex; gap: 5px; flex-wrap: wrap; }
    .item-badge { background: #e8f4ff; color: #3ea8ff; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; white-space: nowrap; }
    .item-actions { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
    .btn-icon { background: none; border: 1px solid #d5dce4; border-radius: 6px; padding: 3px 7px; font-size: 11px; cursor: pointer; color: #5d6d7e; transition: all 0.1s; }
    .btn-icon:hover { background: #3ea8ff; border-color: #3ea8ff; color: white; }
    .clear-btn { display: block; width: calc(100% - 28px); margin: 8px 14px; padding: 7px; border: 1px dashed #d5dce4; background: none; border-radius: 8px; font-size: 12px; color: #95a5a6; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .clear-btn:hover { border-color: #e74c3c; color: #e74c3c; background: #fff5f5; }
    .footer { padding: 6px 14px; text-align: center; font-size: 10px; color: #bdc3c7; }
    .toast { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%) translateY(20px); background: #2c3e50; color: white; padding: 7px 16px; border-radius: 20px; font-size: 12px; opacity: 0; transition: all 0.2s; pointer-events: none; white-space: nowrap; z-index: 100; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="header">
    <div><div class="header-title">freee クイック検索</div><div class="header-sub">📋 検索履歴</div></div>
    <div class="header-icon">🔍</div>
  </div>
  <div class="search-bar">
    <input class="search-input" type="text" id="filterInput" placeholder="履歴を絞り込み...">
  </div>
  <div class="list" id="historyList"></div>
  <button class="clear-btn" id="clearBtn">🗑️ 履歴をすべて消去</button>
  <div class="footer">テキストを選択して右クリック → freee で検索</div>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
